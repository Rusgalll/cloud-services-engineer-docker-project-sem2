name: Docker Project Deploy

on:
  push:
    branches:
      - main

jobs:
  build_and_push_to_docker_hub:
      name: Push Docker image to DockerHub
      runs-on: ubuntu-latest
      steps:
        - name: Check out the repo
          uses: actions/checkout@v3
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2
        - name: Login to Docker 
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Push Backend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./backend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/docker-project-backend:latest
        - name: Push Frontend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./frontend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/docker-project-frontend:latest

  run-with-docker-compose:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build via Docker Compose
        uses: hoverkraft-tech/compose-action@v2.2.0

  compose_status_check:
    name: Verify application via Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Start and wait until healthy
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check frontend and backend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 http://localhost:8081/health
          curl --fail --silent --show-error --max-time 10 http://localhost/momo-store/catalog -o /dev/null
          curl --fail --silent --show-error --max-time 10 http://localhost/api/products | jq -e '.results | length > 0'
          curl --fail --silent --show-error --max-time 10 http://localhost/api/categories | jq -e 'type == "array" and length > 0'
      - name: Check Nginx cache
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 http://localhost/api/products -o /dev/null
          headers=$(curl --fail --silent --show-error --max-time 10 -D - http://localhost/api/products -o /dev/null)
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -qi '^X-Cache-Status: HIT'
          docker compose exec -T frontend sh -c 'test -n "$(find /var/cache/nginx/catalog -type f -print -quit)"'
      - name: Show status
        if: always()
        run: docker compose ps --all
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  security_scan:
    name: Scan ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    env:
      IMAGE_TAG: ci-${{ github.sha }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker compose build --pull ${{ matrix.service }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: momo-${{ matrix.service }}:ci-${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
