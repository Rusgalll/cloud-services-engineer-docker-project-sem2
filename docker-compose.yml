services:
  backend:
    image: momo-backend:${IMAGE_TAG:-1.0}
    build:
      context: ./backend
      args:
        GO_VERSION: ${GO_VERSION:-1.26.7}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.24.1}
    expose:
      - "8081"
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    user: "10001:10001"
    restart: unless-stopped
    stop_grace_period: 15s
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  backend-lb:
    image: momo-backend-lb:${IMAGE_TAG:-1.0}
    build:
      context: ./deploy/backend-lb
      args:
        NGINX_TAG: ${NGINX_TAG:-stable-alpine}
    ports:
      - "8081:8080"
    depends_on:
      backend:
        condition: service_healthy
    user: "101:101"
    restart: unless-stopped
    stop_grace_period: 15s
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend
      - frontend

  frontend:
    image: momo-frontend:${IMAGE_TAG:-1.0}
    build:
      context: ./frontend
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
        NGINX_TAG: ${NGINX_TAG:-stable-alpine}
        VUE_APP_API_URL: /api
    ports:
      - "80:8080"
    depends_on:
      backend-lb:
        condition: service_healthy
    user: "101:101"
    volumes:
      - frontend_cache:/var/cache/nginx/catalog
    restart: unless-stopped
    stop_grace_period: 15s
    cpus: "0.5"
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/momo-store/index.html"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend

volumes:
  frontend_cache:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
