proxy_cache_path /var/cache/nginx/catalog levels=1:2 keys_zone=catalog:4m
                 max_size=32m inactive=1h use_temp_path=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $backend http://backend:8081;

    location ~ ^/api/(?<resource>products|categories)/?$ {
        proxy_pass $backend/$resource$is_args$args;
        proxy_cache catalog;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_valid 200 1m;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization $http_cookie;
        proxy_no_cache $http_authorization $http_cookie;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_cache off;
    }

    location = / {
        return 302 /momo-store/;
    }

    location = /momo-store {
        return 301 /momo-store/;
    }

    location /momo-store/ {
        try_files $uri $uri/ /momo-store/index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|map)$ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
